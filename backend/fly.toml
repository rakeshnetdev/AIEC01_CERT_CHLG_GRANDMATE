# fly.toml app configuration file generated for aiec01-cert-chlg-grandmate-exxpya on 2026-07-21T00:02:26Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'aiec01-cert-chlg-grandmate-exxpya'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  CHROMA_DB_PATH = '/app/data/chroma'
  EMBED_MODEL = 'text-embedding-3-small'
  HOST = '0.0.0.0'
  LLM_FALLBACK_MODEL = 'gpt-4o-mini'
  LLM_MODEL = 'gpt-4o-mini'
  PORT = '8000'
  RETRIEVER_TYPE = 'hybrid'
  USE_LLM_JUDGE = 'false'

[[mounts]]
  source = 'chroma_data'
  destination = '/app/data/chroma'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m30s'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
