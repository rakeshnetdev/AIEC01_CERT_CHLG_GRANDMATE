[project]
name = "grandmate-backend"
version = "0.1.0"
description = "Grandmate Chess Coach Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-chess>=1.999",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "litellm>=1.50",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "openai>=1.40",
    "pandas>=2.2",
    "zstandard>=0.22",
    "chromadb>=0.5",
    "qdrant-client>=1.11",
    "tavily-python>=0.5",
    "rank-bm25>=0.2",
    "ragas>=0.1",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langsmith>=0.1",
    "langgraph-cli[inmem]",
    # Required by coach.rag.loader.load_pdf (PyPDFLoader) to ingest the FIDE rulebook
    # into the 'rules' bucket. Previously undeclared, so load_pdf failed silently and
    # the rules corpus shipped without the rulebook.
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
